hostname R-EIGRP-2
no ip domain-lookup
interface GigabitEthernet0/0
 description LAN_100_HOSTS
 ip address 172.16.0.1 255.255.255.128
 no shutdown
 exit
interface Serial0/1/0
 description ENLACE_DIRECTO_EIGRP
 ip address 10.0.0.14 255.255.255.252
 bandwidth 100000
 delay 300
 no shutdown
 exit
interface Serial0/1/1
 description HACIA_CENTRAL
 ip address 10.0.0.22 255.255.255.252
 bandwidth 100000
 delay 1100
 no shutdown
 exit
router eigrp 100
 no auto-summary
 passive-interface default
 no passive-interface Serial0/1/0
 no passive-interface Serial0/1/1
 network 172.16.0.0 0.0.15.255
 network 10.0.0.14 0.0.0.0
 network 10.0.0.22 0.0.0.0
 variance 4
 maximum-paths 2
 traffic-share balanced
 exit
end
