hostname R-OSPF-1
no ip domain-lookup
interface GigabitEthernet0/0
 description TRUNK_SW_OSPF_1
 no shutdown
 exit
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.1.1 255.255.255.192
 exit
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 192.168.1.65 255.255.255.240
 exit
interface Serial0/1/0
 description ENLACE_DIRECTO_OSPF
 ip address 10.0.0.1 255.255.255.252
 bandwidth 100000
 clock rate 64000
 ip ospf cost 20
 no shutdown
 exit
interface Serial0/1/1
 description HACIA_CENTRAL
 ip address 10.0.0.6 255.255.255.252
 bandwidth 100000
 ip ospf cost 10
 no shutdown
 exit
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Serial0/1/0
 no passive-interface Serial0/1/1
 network 192.168.0.0 0.0.15.255 area 0
 network 10.0.0.1 0.0.0.0 area 0
 network 10.0.0.6 0.0.0.0 area 0
 maximum-paths 2
 exit
end
